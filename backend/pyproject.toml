[project]
name = "mealmate-backend"
version = "2.0.0.dev0"
description = "MealMate backend: FastAPI, SQLAlchemy and Alembic on SQLite"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "Bublemann" }]
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "bcrypt>=5.0",
    "httpx>=0.28.1",
    "pillow>=12.3",
    "typer>=0.27",
    "anyio>=4.15",
]

[project.urls]
Source = "https://github.com/Bublemann/MealMate"

[project.scripts]
mealmate = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "hypothesis>=6.168",
    "respx>=0.23",
    "ruff>=0.16.9",
    "mypy>=2.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# hatch_build.py bundles alembic.ini and alembic/ into non-editable wheels.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.uv]
# Rebuild the project when any of its sources change, not only pyproject.toml; otherwise a
# non-editable install (the image's `uv sync --no-editable`) can reuse a stale cached wheel.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "alembic.ini" },
    { file = "alembic/**/*.py" },
    { file = "alembic/**/*.mako" },
    { file = "app/**/*.py" },
    { file = "app/**/*.txt" },
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ holds the migrations; the `alembic` package is the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --cov=app --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
