# Alembic configuration. `mealmate db upgrade` is the normal way to migrate (it snapshots the
# database first). Plain `alembic` commands work too; they read the MEALMATE_* settings
# (MEALMATE_SECRET_KEY and MEALMATE_DATA_DIR), as the dev container provides them.
#
# New migration (models changed):
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add users"
# Review the generated file; the migration tests also check it against a populated database.

[alembic]
script_location = %(here)s/alembic
# NNNN_slug.py, with NNNN passed as --rev-id
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
