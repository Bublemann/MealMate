services:
  mealmate:
    build: .
    container_name: mealmate-app
    ports:
      - "8443:8443"
    volumes:
      # Named volume for persistent database storage
      - mealmate_data:/data
      # Serve frontend as static files
      - ./frontend:/app/frontend:ro
      # Mount SSL certificates
      - ./certs:/app/certs:ro
    environment:
      - DATABASE_PATH=/data/mealmate.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-use-a-long-random-string}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, ssl; urllib.request.urlopen('https://localhost:8443/health', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Named volumes for data persistence
volumes:
  mealmate_data:
    driver: local
    # Data persists across container recreations
    # To backup: docker run --rm -v mealmate_data:/data -v $(pwd):/backup alpine tar czf /backup/mealmate-backup.tar.gz -C /data .
    # To restore: docker run --rm -v mealmate_data:/data -v $(pwd):/backup alpine sh -c "cd /data && tar xzf /backup/mealmate-backup.tar.gz"
