# Builds the release image for a pushed tag vX.Y.Z[-pre] (plan § 10.2): natively on amd64 and
# arm64, pushed by digest, merged into one multi-arch manifest on ghcr.io and given signed build
# provenance. The Pi only installs images with a valid attestation from this workflow (SEC-12).
name: Build image

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bublemann/mealmate

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      line: ${{ steps.tag.outputs.line }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag format and release branch
        id: tag
        run: .github/scripts/tag-info.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # check out the tagged commit
      packages: write # push the platform image by digest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MEALMATE_VERSION=${{ needs.verify.outputs.version }}
            MEALMATE_COMMIT=${{ needs.verify.outputs.commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Multi-arch manifest
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # list the release tags
      packages: write # push the multi-arch manifest and its tags
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          LINE: ${{ needs.verify.outputs.line }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          # X.Y.Z or X.Y.Z-pre.N, plus X.Y / latest / X.Y-pre only while this is the newest release
          # for them. Decided from the tags as they are now, right before pushing, so a slower or
          # re-run build of an older release never moves them back.
          release_tags=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --paginate \
            --jq '.[].ref | sub("^refs/tags/"; "")')
          image_tags=$("${GITHUB_WORKSPACE}/.github/scripts/image-tags.sh" \
            "$VERSION" "$LINE" "$PRERELEASE" <<< "$release_tags")
          mapfile -t names <<< "$image_tags"
          tags=()
          for name in "${names[@]}"; do tags+=(--tag "${IMAGE}:${name}"); done
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.title=MealMate" \
            --annotation "index:org.opencontainers.image.description=Self-hosted app that turns saved meals into a category-sorted shopping list" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT}" \
            "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${IMAGE}@${digest}\` as: ${names[*]}" >> "$GITHUB_STEP_SUMMARY"

  attest:
    name: Attest build provenance
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC identity for the Sigstore signing certificate
      attestations: write # store the attestation in the repository
      packages: write # push the attestation next to the image
      artifact-metadata: write # record where the attested image is stored
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
