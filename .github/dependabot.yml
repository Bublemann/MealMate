# Monthly dependency updates, minor and patch only, grouped per ecosystem (SEC-11, D-50). Majors
# are skipped for every dependency, and so are new Python versions (D-52); the quarterly
# chore(deps) ticket moves to the ones that are ready. Security updates are not held back: the
# ignores and the cooldown apply to version updates only.
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/backend", "/e2e", "/deploy/tests"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot reads python:3.14-slim as version 3.14, so Python 3.15 would be a minor update.
      # 3.14 patch releases still arrive as new digests of the same tag.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  # The node image of compose.dev.yml (the same digest as the Dockerfile's).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
