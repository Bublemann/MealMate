# Weekly dependency updates, minor and patch grouped per ecosystem (SEC-11). Security updates are
# not delayed by the cooldown. Majors come as single PRs.
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/backend", "/e2e"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-jsx-a11y supports ESLint up to 9; lift this once it supports 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Types follow the Node LTS line the app runs on (24); bump together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Only even-numbered Node releases become LTS; odd ones are skipped.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]

  # The node image of compose.dev.yml (the same digest as the Dockerfile's).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Only even-numbered Node releases become LTS; odd ones are skipped.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
